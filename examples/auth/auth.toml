# Minimal auth config for `DBT_STATE_AUTH=oidc`
# (DBT_STATE_AUTH_CONFIG=/path/to/auth.toml). Read once at startup; changes
# apply on restart. Unknown keys are refused.

[broker]
# The Token broker's public URL: the `iss` of every token it issues. Its OIDC
# discovery document is at <issuer>/.well-known/openid-configuration, and
# its authorization endpoint (the dbt client's RUN_CACHE_AUTH_URL) is
# <issuer>/ itself.
issuer = "https://auth.state.example.com"
# Optional: browser sign-ins in progress per client IP (default 20).
# max_pending_logins_per_ip = 20
# Optional, only behind a proxy that sets it on every request: the header
# whose last comma-separated entry is the client IP.
# client_ip_header = "x-forwarded-for"
# Optional, for a gRPC server without [signing]: where to fetch the Token
# broker's keys. Unset, they are found by OIDC discovery at `issuer`. Keys
# are fetched only over https (plain http only on a loopback address).
# jwks_url = "https://dbt-state-broker.internal/jwks"

[api]
# The dbt State API audience: the only `aud` the gRPC server accepts.
audience = "https://state.example.com"

[tokens]
# Optional. Person tokens: 15 to 240 minutes (default 60).
person_lifetime_minutes = 60
# Machine tokens: 15 to 60 minutes (default 15).
machine_lifetime_minutes = 15

[signing]
# The Token broker needs these; a gRPC server may leave [signing] out and
# check tokens against the Token broker's published keys instead.
# RS256 keys from mounted PEM files (PKCS#8 or PKCS#1, 2048 to 4096 bits).
# Every listed key verifies tokens; new tokens are signed with the active one.
# Relative paths resolve from this file's directory.
active_key_id = "2026-11"

[[signing.keys]]
id = "2026-11"
private_key_file = "keys/signing-2026-11.pem"

[[signing.keys]]
id = "2026-05"
private_key_file = "keys/signing-2026-05.pem"

# Organization ids: non-empty visible ASCII, no ':' or whitespace, not '*'.
[[organizations]]
id = "analytics"

[[organizations]]
id = "finance"
# A disabled Organization is refused on every request.
disabled = true

# The Token broker's Upstream IdP, found by OIDC discovery at
# <issuer>/.well-known/openid-configuration. The issuer and the token and
# JWKS endpoints it publishes must be https (plain http only on loopback).
[upstream]
issuer = "https://login.example.com/00000000-0000-0000-0000-000000000000/v2.0"
# The `aud` an upstream access token must hold. Tokens for any other
# application (for example Microsoft Graph), and opaque tokens, are refused.
api_audience = "api://dbt-state"
# Optional: the `scope` requested on the IdP's client_credentials grant
# (Entra ID needs "<api>/.default"). The scope the dbt client asks for is
# ignored.
client_credentials_scope = "api://dbt-state/.default"
# Optional: the claim that, with the issuer, identifies a Principal (person
# or machine). Default "sub"; on Entra ID use "oid". Email is display only.
subject_claim = "oid"

# Browser sign-in for people. The Token broker signs in at the IdP as an
# OIDC relying party under its own client id; register
# <broker.issuer>/callback as that client's redirect URI. Without client_id,
# only machines (client_credentials) are served.
client_id = "22222222-3333-4444-5555-666666666666"
# Its credential at the IdP's token endpoint, from a mounted file (never the
# database): an RSA private key for private_key_jwt (preferred), or
# client_secret_file for a client secret sent as HTTP Basic. Set exactly one.
private_key_file = "keys/idp-client.pem"
# Optional: the `kid` the IdP knows the key by.
# private_key_id = "broker-2026-11"
# client_secret_file = "keys/idp-client-secret"
# The key stored upstream refresh tokens are encrypted with (AES-256-GCM):
# the base64 of 32 random bytes, `openssl rand -base64 32`.
refresh_token_key_file = "keys/refresh-token.key"
# Optional: the scope requested at sign-in. It must include openid, and
# offline_access where the IdP needs it for a refresh token (Entra ID, Okta).
# login_scope = "openid offline_access email profile"

# Optional: the dbt client registration. Its client id defaults to the dbt
# client's built-in one; its redirect URI is always
# http://127.0.0.1:29525/handler, and PKCE S256 is required.
# [clients.dbt]
# client_id = "2fd87cd5-69a6-4c5f-9097-747a58f0edf6"

# Optional: the UI registration, a confidential OIDC client. Its own client
# id (the `aud` of its tokens, which gRPC never accepts), exactly one
# callback (https; plain http only on loopback), and the RSA public key of
# the key pair it signs private_key_jwt assertions with (PEM "BEGIN PUBLIC
# KEY", `openssl pkey -in ui-client.pem -pubout`). No secret exists for it.
# [clients.ui]
# client_id = "dbt-state-ui"
# redirect_uri = "https://console.state.example.com/auth/callback"
# public_key_file = "keys/ui-client.pub.pem"

# Mapping rules. Each applies only to its Principal kind: "person" for
# browser sign-in, "machine" for client_credentials. A rule matches when
# `claim` is `value`, or is an array of strings holding it. The highest Role
# wins per Organization; a Principal no rule matches is refused.
[[rules]]
kind = "person"
claim = "groups"
value = "00000000-aaaa-bbbb-cccc-000000000000"
organization = "analytics"
role = "developer"

[[rules]]
kind = "machine"
claim = "roles"
value = "dbt-state.ci"
organization = "analytics"
role = "developer"

[[rules]]
kind = "machine"
claim = "azp"
value = "11111111-2222-3333-4444-555555555555"
organization = "analytics"
role = "admin"
