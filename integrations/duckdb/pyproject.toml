[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "dbt-state-duckdb-local"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "dbt-core==1.10.15",
  "dbt-duckdb==1.10.0",
  "duckdb==1.4.1",
  "dbt-state==2.62.6",
  "query-cache-common==2.7.0",
  "query-cache-protobuf==2.7.0",
]

[project.scripts]
dbt-state-duckdb = "dbt_state_duckdb:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dbt_state_duckdb"]
