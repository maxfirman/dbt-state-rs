[package]
name = "dbt-state-harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "record-proxy"
path = "src/bin/record_proxy.rs"

[[bin]]
name = "diff-fuzz"
path = "src/bin/diff_fuzz.rs"
required-features = ["fuzz"]

[features]
# Opt-in differential-fuzz tool: pulls in the server + sqlx so it can run our
# server in-process and compare against the real service. Not needed for CI.
fuzz = ["dep:dbt-state-server", "dep:sqlx"]

[dependencies]
dbt-state-proto = { path = "../proto" }
dbt-state-server = { path = "../server", optional = true }
sqlx = { workspace = true, optional = true }
tonic.workspace = true
tonic-prost.workspace = true
prost.workspace = true
prost-types.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
async-trait.workspace = true
uuid.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
reqwest.workspace = true

[dev-dependencies]
dbt-state-server = { path = "../server" }
sqlx.workspace = true
tokio.workspace = true
