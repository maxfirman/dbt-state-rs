# The pinned dbt-state Python client, for the harness's client driver
# (`driver.py`, run by `crates/harness/tests/python_client.rs`). Locked in
# `uv.lock`; the driver only runs the package's own code.
[project]
name = "dbt-state-python-client-driver"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "dbt-state==2.62.6",
  "query-cache-common==2.7.0",
  "query-cache-protobuf==2.7.0",
  "dbt-core==1.10.15",
]

[tool.uv]
package = false
