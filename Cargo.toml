[workspace]
resolver = "2"
members = [
    "crates/proto",
    "crates/server",
    "crates/harness",
    "crates/ui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Open-source, self-hostable reimplementation of the dbt State (query cache) gRPC decision service."
repository = "https://github.com/maxfirman/dbt-state-rs"

[workspace.dependencies]
tonic = { version = "0.14", features = ["tls-native-roots"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tonic-health = "0.14"
prost = "0.14"
prost-types = "0.14"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
async-trait = "0.1"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid", "json", "macros", "migrate"] }
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4", "v7"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
